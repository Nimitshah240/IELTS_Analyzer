<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel='stylesheet' href='../CommonUtils/commonCss.css'>
    <link rel='stylesheet' href='./IA_Delete.css'>
    <script src='./IA_Delete.js'></script>
    <script src='../CommonUtils/commonMethod.js'></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body style="margin: 0px;" onload="deleteConnectedCallback()">
    <main id="main">
        <!-- <div class="delete-popup"> -->
        <div class="delete-pop">
            <div class="delete-box glass">
                <div class="header-delete"> Delete </div>
                <div class="body-delete">
                    <div class="delete-icon">
                        <div class="trash">
                            <i class="fa fa-trash" aria-hidden="true"></i>
                        </div>
                    </div>
                    <div class="delete-text">
                        Do you want to delete?
                    </div>
                </div>
                <div class="footer-delete">
                    <button class="button-63-delete" onclick="deleteYes(event)" role="button" id="yes">Delete</button>
                    <button class="button-63-delete button-64-delete" onclick="deleteNo(event)" role="button"
                        id="no">Cancel</button>
                </div>
            </div>
        </div>
        <!-- </div> -->
    </main>
</body>

</html>
