<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel='stylesheet' href='./IA_AdPopup.css'>
    <link rel='stylesheet' href='../../IA_Toast/IA_Toast.css'>
    <link rel='stylesheet' href='../../CommonUtils/CommonCss.css'>

    <script src='./IA_AdPopup.js'></script>
    <script src='../..//IA_Toast/IA_Toast.js'></script>
    <script src='../../CommonUtils/commonMethod.js'></script>
</head>

<body style="margin: 0px;" onload="adPopupConnectedCallback()">
    <!-- Toast -->
    <ul class="notifications" id="notifications"></ul>
    <!-- Toast -->
    <!-- Spinner -->
    <iframe name="spinner" id="spinner" class="spinner" frameborder="0"></iframe>
    <!-- Spinner -->
    <iframe src="../../IA_PopupView/IA_PopupView.html" id="popupFrame" class="popup-frame" frameborder="0"></iframe>
    <main id="main">
        <div class="kyc-pop">
            <div class="kyc-box glass">
                <div class="header-kyc"> Advertisement </div>
                <div class="save-data ">
                    <div class="incorrect-answer">
                        <label class="input-title"><span style="color: red;">*</span> Slot
                            :</label>
                        <!-- <input type="text" class="inputbox" onkeydown="keyPressed()" placeholder="Name as per document"
                            id="name"> -->
                        <select class="inputbox has-scrollbar" name="slots" id="slots" multiple size="2">
                        </select>
                    </div>
                    <div class="incorrect-answer">
                        <label class="input-title"> Cost
                            :</label>
                        <input type="text" class="inputbox" onkeydown="keyPressed()" placeholder="Total Cost" id="cost"
                            disabled>
                    </div>
                    <div class="incorrect-answer">
                        <label class="input-title"> Selected Page
                            :</label>
                        <!-- <input type="text" class="inputbox" onkeydown="keyPressed()" placeholder="Account Number"
                            id="accNumber"> -->
                        <select class="inputbox has-scrollbar" name="page" id="page" size="1" multiple disabled>
                        </select>
                    </div>
                    <div class="incorrect-answer">
                        <label class="input-title">Selected Type
                            :</label>
                        <!-- <input type="text" class="inputbox" onkeydown="keyPressed()" placeholder="Bank Name"
                            id="bankName"> -->
                        <select class="inputbox has-scrollbar" name="type" id="type" size="1" multiple disabled>
                        </select>
                    </div>
                    <div class="incorrect-answer">
                        <label class="input-title"><span style="color: red;">*</span> Start Date
                            :</label>
                        <input type="date" class="inputbox" onkeydown="keyPressed()" placeholder="Start Date"
                            id="startDate">
                    </div>
                    <div class="incorrect-answer">
                        <label class="input-title"><span style="color: red;">*</span> Url
                            :</label>
                        <input type="text" class="inputbox" onkeydown="keyPressed()" placeholder="Website Link"
                            id="url">
                    </div>

                    <div class="incorrect-answer">
                        <label class="input-title"><span style="color: red;">*</span> Old Advertisement
                            :</label>
                        <select name="oldAd" onchange="selectOldAdvertisement()" id="oldAd" class="inputbox">
                        </select>
                    </div>
                    <div class="or"><b>OR</b></div>
                    <div class="incorrect-answer">
                        <label class="input-title"><span style="color: red;">*</span> New
                            Advertisement :</label>
                        <input type="file" class="inputbox" onchange="keyPressed()" id="fileInput">
                    </div>
                </div>
                <div class="footer-kyc">
                    <button class="button-63-kyc" onclick="saveUpdateBtn(event)" role="button" id="btnYes">Save</button>
                    <button class="button-63-kyc button-64-kyc" onclick="closeBtn(event)" role="button" id="no">Cancel
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
