<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel='stylesheet' href='../../CommonUtils/CommonCss.css'>
    <link rel='stylesheet' href='./IA_KycPopup.css'>
    <link rel='stylesheet' href='../../IA_Toast/IA_Toast.css'>
    <script src='./IA_KycPopup.js'></script>
    <script src='../..//IA_Toast/IA_Toast.js'></script>
    <script src='../../CommonUtils/commonMethod.js'></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body style="margin: 0px;" onload="kycConnectedCallback()">
    <!-- Toast -->
    <ul class="notifications" id="notifications"> </ul>
    <!-- Toast -->

    <main id="main">
        <div class="kyc-pop">
            <div class="kyc-box glass">
                <div class="header-kyc"> Kyc </div>
                <div class="save-data">
                    <div class="incorrect-answer">
                        <label for="exam-name" class="input-title"><span style="color: red;">*</span> Full Name
                            :</label>
                        <input type="text" class="inputbox" onkeypress="keyPressed()" placeholder="Name as per document"
                            id="name">
                    </div>
                    <div class="incorrect-answer">
                        <label for="exam-date" class="input-title"><span style="color: red;">*</span> Document Number
                            :</label>
                        <input type="text" class="inputbox" onkeypress="keyPressed()" placeholder="Document Number"
                            id="docNumber">
                    </div>
                    <div class="incorrect-answer">
                        <label for="exam-date" class="input-title"><span style="color: red;">*</span> Document Type
                            :</label>
                        <!-- <input type="text" class="inputbox" placeholder="Document Number" id="docNumber"> -->
                        <select class="inputbox" name="Document Type" id="docType" onselect="keyPressed()">
                            <option value="Aadhar Card">Aadhar Card</option>
                            <option value="Pan Card">Pan Card</option>
                        </select>
                    </div>
                    <div class="incorrect-answer">
                        <label for="exam-date" class="input-title"><span style="color: red;">*</span> Document Upload
                            :</label>
                        <input type="file" class="inputbox" id="fileInput" onchange="keyPressed()">
                    </div>
                </div>
                <div class="footer-kyc">
                    <button class="button-63-kyc" onclick="saveUpdateBtn(event)" role="button" id="btnYes">Save</button>
                    <button class="button-63-kyc button-64-kyc" onclick="closeBtn(event)" role="button"
                        id="no">Cancel</button>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
